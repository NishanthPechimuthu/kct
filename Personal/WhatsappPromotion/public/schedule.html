<!DOCTYPE html>
<html>

<head>
    <title>Schedule Promotion</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Schedule Promotion</h2>

    <input id="image" placeholder="Image URL">
    <textarea id="message" placeholder="Promotion Message"></textarea>
    <input type="datetime-local" id="time">

    <button onclick="saveSchedule()">Save Schedule</button>

    <script>
        function saveSchedule() {
            fetch("/add-schedule", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    image: document.getElementById("image").value,
                    message: document.getElementById("message").value,
                    time: document.getElementById("time").value
                })
            })
                .then(res => res.json())
                .then(data => alert(data.message));
        }
    </script>

    <br><br>
    <a href="index.html">Back to Promotion Page</a>

</body>

</html>
